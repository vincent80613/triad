name: Release Triad

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TRIAD_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Windows code-signing secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "::error::Windows releases require repository secrets CSC_LINK (base64-encoded .pfx) and CSC_KEY_PASSWORD."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}." >&2
            exit 1
          fi

      - name: Configure public update feed
        run: npm run release:feed

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $artifacts = @(
            "release/Triad-Setup-$version.exe",
            "release/win-unpacked/Triad.exe"
          )
          foreach ($path in $artifacts) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing signed artifact: $path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "Windows signature invalid for ${path}: $($signature.Status)"
            }
            Write-Host "Signed ${path} by $($signature.SignerCertificate.Subject)"
          }

      - name: Generate update manifest
        run: npm run release:manifest

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          installer="release/Triad-Setup-${version}.exe"
          blockmap="${installer}.blockmap"
          manifest="release/latest.yml"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" "$blockmap" "$manifest" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$installer" "$blockmap" "$manifest" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Triad ${version}" \
              --notes-file release/RELEASE_NOTES.md
          fi
